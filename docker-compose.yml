version: '3.8'

services:
  # ===== 后端 API 服务 =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ciguang-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-please-change-this-jwt-secret}
      - JWT_EXPIRES_IN=7d
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_API_URL=${DEEPSEEK_API_URL:-https://api.deepseek.com/v1/chat/completions}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
    volumes:
      # 持久化 SQLite 数据库，避免容器重建后数据丢失
      - backend-db:/app/database
    networks:
      - ciguang-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ===== 前端静态服务 =====
  web:
    image: nginx:alpine
    container_name: ciguang-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # 挂载前端静态文件到 nginx html 目录
      - ./:/usr/share/nginx/html:ro
      # 挂载自定义 nginx 配置
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ciguang-net

networks:
  ciguang-net:
    driver: bridge

volumes:
  backend-db:
    driver: local
